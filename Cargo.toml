[package]
name = "pomodoro"
version = "0.1.0"
edition = "2024"
description = "A minimalist tomato Pomodoro timer"
license = "MIT"
repository = "https://github.com/Aqualy/Pom"

[dependencies]
slint = "1.18"
notify-rust = "4.18"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
directories = "6"

[build-dependencies]
slint-build = "1.18"

[package.metadata.packager]
product-name = "Pomodoro"
identifier = "com.aqualy.pomodoro"
publisher = "Aqualy"
category = "Productivity"
before-packaging-command = "cargo build --release --locked"
icons = ["icons/32x32.png", "icons/128x128.png", "icons/256x256.png", "icons/512x512.png", "icons/icon.ico", "icons/icon.icns"]

[package.metadata.packager.nsis]
installer-icon = "icons/icon.ico"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
