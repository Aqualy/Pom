name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  LINUX_DEPS: libfontconfig1-dev libxkbcommon-dev libasound2-dev libdbus-1-dev libfuse2t64

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --release --locked

  package:
    name: Package (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            formats: nsis
          - os: ubuntu-latest
            formats: deb,appimage
          # The dmg is assembled below so the app can be signed first.
          - os: macos-latest
            formats: app
    runs-on: ${{ matrix.os }}
    env:
      # linuxdeploy is itself an AppImage; this avoids needing FUSE on the runner.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-packager --locked
      - run: cargo packager --release --formats ${{ matrix.formats }} --out-dir dist
      # An unsigned bundle downloaded on Apple Silicon is reported as "damaged" and
      # can't be opened at all. Ad-hoc signing seals the bundle, so Gatekeeper shows
      # the regular "unidentified developer" prompt instead, which users can bypass.
      - if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/Pom.app
          codesign --verify --deep --strict dist/Pom.app
          version=$(cargo pkgid | sed 's/.*[#@]//')
          arch=$(uname -m | sed 's/arm64/aarch64/')
          mkdir dmg-root
          mv dist/Pom.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname Pom -srcfolder dmg-root -format UDZO "dist/Pom_${version}_${arch}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.deb
            dist/*.AppImage
            dist/*.dmg
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
